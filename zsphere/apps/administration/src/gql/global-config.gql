query globalConfig($category: String!, $name: String!) {
  globalConfig(category: $category, name: $name) {
    category
    defaultValue
    description
    name
    value
    uuid
    isValid
  }
}

query globalConfigList(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $extraConditions: [Condition!]
  $type: GlobalConfigQueryType
  $sortBy: String
) {
  globalConfigList(
    start: $start
    limit: $limit
    replyWithCount: true
    conditions: $conditions
    extraConditions: $extraConditions
    type: $type
    sortBy: $sortBy
  ) {
    total
    list {
      category
      defaultValue
      description
      name
      value
      uuid
      isValid
    }
  }
}

query getCustomCpuMode {
  getCustomCpuMode {
    list
  }
}
