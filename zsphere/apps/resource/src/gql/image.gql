fragment imageFields on Image {
  uuid
  name
  createDate
  lastOpDate
  description
  architecture
  state
  status
  size
  actualSize
  md5Sum
  url
  mediaType
  guestOsType
  type
  platform
  format
  system
  bootMode
  baremetal2Image
  toPublic
  shareType
  useFor
  guestOsType
  virtio
  isZmigrateImage
  backupStorageRefs {
    imageUuid
    backupStorageUuid
    installPath
    status
    exportMd5Sum
    exportUrl
    createDate
    lastOpDate
  }
  backupStorage {
    name
    uuid
    type
    zone {
      uuid
      name
    }

  }
  availableUserVm
  owner {
    name
    uuid
    type
  }
}

query imageList(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $extraConditions: [Condition!]
  $type: ImageQueryType
  $sortBy: String
  $sortDirection: SortDirectionValidValues
) {
  imageList(
    start: $start
    limit: $limit
    replyWithCount: true
    conditions: $conditions
    extraConditions: $extraConditions
    type: $type
    sortBy: $sortBy
    sortDirection: $sortDirection
  ) {
    total
    list {
      ...imageFields
    }
  }
}

query imageListForZSVCreateInstance(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $extraConditions: [Condition!]
  $type: ImageQueryType
  $sortBy: String
  $sortDirection: SortDirectionValidValues
) {
  imageList(
    start: $start
    limit: $limit
    replyWithCount: true
    conditions: $conditions
    extraConditions: $extraConditions
    type: $type
    sortBy: $sortBy
    sortDirection: $sortDirection
  ) {
    total
    list {
      uuid
      name
      createDate
      lastOpDate
      architecture
      state
      status
      size
      actualSize
      mediaType
      guestOsType
      type
      format
      system
      shareType
      owner {
        name
        uuid
        type
      }
      availableUserVm
      url
    }
  }
}

query imageSupportBootModeForBareMetal2Instance {
  imageSupportBootModeForBareMetal2Instance
}
query getImageSummary($conditions: [Condition!]!) {
  getImageSummary(conditions: $conditions) {
    total
    available
    destroyed
  }
}

mutation detachIsoFromVm($input: DetachIsoFromVmInstanceInput!) {
  detachIsoFromVm(input: $input) {
    error {
      code
      details
      description
    }
  }
}

