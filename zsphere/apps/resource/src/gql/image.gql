query guestOsTypeList {
  guestOsTypeList {
    list {
      platform
      children {
        guestName
        children {
          uuid
          platform
          name
          osRelease
          version
        }
      }
    }
  }
}

query guestOsType($guestOs: String!) {
  guestOsType(guestOs: $guestOs) {
    uuid
    platform
    name
    osRelease
    version
  }
}

query guestNameList {
  guestNameList {
    name
  }
}

query imageCount(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $extraConditions: [Condition!]
  $type: ImageQueryType
  $sortBy: String
  $sortDirection: SortDirectionValidValues
) {
  imageList(
    start: $start
    limit: $limit
    replyWithCount: true
    conditions: $conditions
    extraConditions: $extraConditions
    type: $type
    sortBy: $sortBy
    sortDirection: $sortDirection
  ) {
    total
  }
}

query guestOsCpuMemHotAddInfoList(
