fragment BaremetalChassisFields on BaremetalChassis {
  uuid
  name
  description
  ipmiAddress
  ipmiPort
  ipmiUsername
  ipmiPassword
  zoneUuid
  clusterUuid
  cluster {
    uuid
    name
  }
  pxeServerUuid
  state
  status
  powerStatus
  hardwareInfos {
    uuid
    type
    content
    chassisUuid
    createDate
    lastOpDate
  }
  baremetalInstance {
    uuid
    name
    state
  }
  zone {
    uuid
    name
  }
  createDate
  lastOpDate
}

query baremetalChassisList(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $extraConditions: [Condition!]
  $sortBy: String
  $sortDirection: SortDirectionValidValues
) {
  baremetalChassisList(
    start: $start
    limit: $limit
    replyWithCount: true
    conditions: $conditions
    extraConditions: $extraConditions
    sortBy: $sortBy
    sortDirection: $sortDirection
  ) {
    total
    list {
      ...BaremetalChassisFields
    }
  }
}

