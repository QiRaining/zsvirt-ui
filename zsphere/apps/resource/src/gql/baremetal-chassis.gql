mutation createBaremetalChassis($input: CreateBaremetalChassisInput!) {
  createBaremetalChassis(input: $input) {
    actionId
  }
}

mutation batchCreateBaremetalChassis($input: BatchCreateBaremetalChassisInput!) {
  batchCreateBaremetalChassis(input: $input) {
    actionId
  }
}

mutation deleteBaremetalChassis($input: DeleteBaremetalChassisInput!) {
  deleteBaremetalChassis(input: $input) {
    actionId
  }
}

mutation updateBaremetalChassis($input: UpdateBaremetalChassisInput!) {
  updateBaremetalChassis(input: $input) {
    actionId
  }
}

mutation inspectBaremetalChassis($input: InspectBaremetalChassisInput!) {
  inspectBaremetalChassis(input: $input) {
    actionId
  }
}

mutation checkBaremetalChassisConfigFile($baremetalChassisInfo: String!) {
  checkBaremetalChassisConfigFile(baremetalChassisInfo: $baremetalChassisInfo) {
    success
    error
  }
}
