}
query ovfFile($ovf: String!) {
  ovfFile(ovf: $ovf) {
    disks {
      fileName
    }
    cpuNum
    memorySize
  }
}

query vmInstanceList(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $type: VmQueryType
  $extraConditions: [Condition!] = []
  $sortBy: String
  $sortDirection: SortDirectionValidValues
) {
  vmInstanceList(
    start: $start
    limit: $limit
    replyWithCount: true
    conditions: $conditions
    type: $type
    extraConditions: $extraConditions
    sortBy: $sortBy
    sortDirection: $sortDirection
  ) {
    total
    list {
      vmUsage {
        cpuUsed
        memoryUsed
        storageUsed
      }
      cpuModeInfo {
        value
        dependentResourceType
      }
      snapshotSchedulerJob {
        uuid
      }
      ...vmInstanceFields
    }
  }
}
query templatedVmInstanceList(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $type: VmQueryType
  $extraConditions: [Condition!] = []
  $sortBy: String
  $sortDirection: SortDirectionValidValues
) {
  vmInstanceList(
    start: $start
    limit: $limit
    replyWithCount: true
    conditions: $conditions
    type: $type
    extraConditions: $extraConditions
    sortBy: $sortBy
    sortDirection: $sortDirection
  ) {
    total
    list {
      vmUsage {
        cpuUsed
        memoryUsed
        storageUsed
      }
      cpuModeInfo {
        value
        dependentResourceType
      }
      isTemplate
      ...vmInstanceFields
    }
  }
}

query ovfExportList(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $extraConditions: [Condition!] = []
  $sortBy: String
  $sortDirection: SortDirectionValidValues
) {
  ovfExportList(
    start: $start
    limit: $limit
    replyWithCount: true
    conditions: $conditions
    extraConditions: $extraConditions
    sortBy: $sortBy
    sortDirection: $sortDirection
  ) {
    total
    list {
      uuid
      name
      exportUrl
      md5Sum
      createDate
      size
      format
      vmInstance {
        name
        uuid
        state
        owner {
          uuid
          name
          type
          linkedAccountUuid
        }
        guestOsType
        cpuNum
        memorySize
        defaultL3NetworkUuid
        tag {
          ownerUuid
          name
          uuid
          color
        }
        vmNics {
          type
          uuid
          mac
          ip
          usedIps {
            uuid
            ip
            ipVersion
            l3NetworkUuid
          }
          l3NetworkUuid
          l3Network {
            ... on L3Network {
              name
              uuid
              l2NetworkUuid
              l2Network {
                uuid
                vSwitchType
              }
            }
          }
        }
        allVolumes {
          uuid
          name
          deviceId
          lastAttachDate
          primaryStorageUuid
          size
          actualSize
          isShareable
          type
          installPath
          primaryStorage {
            type
            uuid
            name
            defaultProtocol
          }
        }
        zone {
          uuid
          name
        }
      }
      backupStorage {
        name
        uuid
      }
    }
  }
}

