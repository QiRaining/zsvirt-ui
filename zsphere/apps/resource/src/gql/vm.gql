    time
    value
  }
  toolsState
  vnuma
  hypervisorType
  cpuNum
  memorySize
  createDate
  lastOpDate
  description
  state
  clusterUuid
  rootVolumeUuid
  attachedShareableVolumeUuidList
  platform
  guestOsType
  guestToolsState {
    osType
    platform
    qgaState
    version
    zwatchState
    vmInstanceUuid
  }
  defaultL3NetworkUuid
  imageUuid
  lastHostUuid
  hostUuid
  backupStatus
  backupTaskStatus
  reservedMemorySize
  defaultL3Network {
    name
    uuid
    ipVersion
    networkType
  }
  backupTaskType
  owner {
    uuid
    name
    type
    linkedAccountUuid
  }
  cluster {
    name
    state
    uuid
  }
  host {
    uuid
    name
    state
    status
    managementIp
    cpuNum
    clusterUuid
  }
  lastHost {
    uuid
    name
    state
    managementIp
    clusterUuid
  }
  sshKeyPairNum
  image {
    name
    uuid
    status
  }
  primaryStorage {
    name
    uuid
    type
    state
    availableCapacity
    defaultProtocol
  }
  tag {
    ownerUuid
    name
    uuid
    color
  }
  vmNics {
    type
    uuid
    mac
    ip
    deviceId
    usedIps {
      uuid
      ip
      ipVersion
      l3NetworkUuid
    }
    l3NetworkUuid
    l3Network {
      ... on L3Network {
        name
        uuid
        l2NetworkUuid
        l2Network {
          uuid
          vSwitchType
        }
        networkServices {
          networkServiceType
        }
      }
    }
  }
  eip {
    uuid
    name
    vipIp
  }
  toolsInfo {
    lowVersion
    version
  }
  allVolumes {
    uuid
    name
    deviceId
    lastAttachDate
    primaryStorageUuid
    size
    actualSize
    isShareable
    type
    installPath
    primaryStorage {
      type
      uuid
      name
      defaultProtocol
    }
  }
  gpuDeviceSpec {
    name
    isVirtual
    type
    uuid
    deviceType
  }
  systemTag {
    cpuCores
    cpuSockets
    haStickStragedy
    sshkey
    bootOrder
    bootOrderOnce
    consolePassword
    vmConsoleMode
    vmPriority
    GuestTools
    bootMode
    RDPEnable
    usbRedirect
    qemuga
    antiSpoofing
    VDIMonitorNumber
    userdata
    clockTrack
    timeTrack
    isoList {
      uuid
      index
    }
    vmCpuPinningList {
      vCPU
      pCPU
    }
    staticIp {
      l3NetworkUuid
      ip
    }
    vmDriver
    hostname
    qxlMemory {
      ram
      vram
      vgamem
    }
    vmMachineType
  }
  vmCdRoms {
    uuid
    isoUuid
  }
  zoneUuid
  zone {
    uuid
    name
  }
  relatedResource {
    backupData
  }
  # cdpTaskStatus
  exportInfo {
    uuid
    name
    exportUrl
    createDate
    size
  }
  vmGroup {
    uuid
    name
    vmSchedulingRuleCount
    associatedVmSchedulingRuleList {
      uuid
      name
      rule
      mode
      hostGroup {
        uuid
        name
      }
    }
    vmCount
  }
  schedulingState
  group {
    groupName
    uuid
  }
  qemuState
  haveScsiLun
  lastBackupJobResult {
    id
    fireInstanceId
    success
    resultDump
  }
  localBackupCount
  localBackupCapacity
  backupJob {
    uuid
    jobData
    state
    schedulerJobGroupJobRefs {
      schedulerJobGroupUuid
      priority
    }
    schedulerJobGroup {
      uuid
      name
    }
  }
  shareType
  userGroup {
    uuid
    name
  }
  lastOpDate
  tpmList {
    uuid
    vmInstanceUuid
  }
  vmHa {
    haLevel
  }
}

query vmInstance($uuid: String!) {
  vmInstance(uuid: $uuid) {
    volumeAttributeUserConfig
    emulatorPin
    sshKeyPairs {
      uuid
      name
    }
    securityGroup {
      name
      uuid
    }
    cpuModeInfo {
      value
      dependentResourceType
    }
    hasTopology
    vmCdRoms {
      uuid
      isoUuid
    }
    consoleAddress
    bootOrder {
      orders
    }
    toolsInfo {
      lowVersion
      features {
        pvpanic
        pvpanic_host_enable
        pvpanic_guest_tools_enable
        pvpanic_guest_kernel_supported
      }
      status
      version
    }
    allVolumes {
      uuid
      name
      deviceId
      lastAttachDate
      primaryStorageUuid
      size
      actualSize
      isShareable
      type
      installPath
      relatedResource {
        backupData
      }
      backupTaskType
      primaryStorage {
        type
        uuid
        name
        defaultProtocol
      }
    }
    snapshotSchedulerJob {
      uuid
      name
      schedulerJobGroup {
        uuid
        name
      }
    }
    uptime
    ...vmInstanceFields
  }
}

query templatedVmInstance($uuid: String!) {
  templatedVmInstance(uuid: $uuid) {
    volumeAttributeUserConfig
    emulatorPin
    sshKeyPairs {
      uuid
      name
    }
    securityGroup {
      name
      uuid
    }
    cpuModeInfo {
      value
      dependentResourceType
    }
    hasTopology
    vmCdRoms {
      uuid
      isoUuid
    }
    consoleAddress
    bootOrder {
      orders
    }
    toolsInfo {
      lowVersion
      features {
        pvpanic
        pvpanic_host_enable
        pvpanic_guest_tools_enable
        pvpanic_guest_kernel_supported
      }
      status
      version
    }
    allVolumes {
      uuid
      name
      deviceId
      lastAttachDate
      primaryStorageUuid
      size
      actualSize
      isShareable
      type
      installPath
      relatedResource {
        backupData
      }
      backupTaskType
      primaryStorage {
        type
        uuid
        name
        defaultProtocol
      }
    }
    snapshotSchedulerJob {
      uuid
      name
    }
    uptime
    isTemplate
    tpmList {
      uuid
      vmInstanceUuid
    }
    ...vmInstanceFields
  }
}

query getRequestConsoleAccess($uuid: String!) {
  getRequestConsoleAccess(uuid: $uuid) {
    hostname
    port
    token
