#import './volume-fragment.gql'

query volumeList(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $extraConditions: [Condition!]
  $type: VolumeQueryType
  $sortBy: String
  $sortDirection: SortDirectionValidValues
  $vmInstanceUuid: String
) {
  volumeList(
    start: $start
    limit: $limit
    replyWithCount: true
    conditions: $conditions
    extraConditions: $extraConditions
    type: $type
    sortBy: $sortBy
    sortDirection: $sortDirection
  ) {
    total
    list {
      ...volumeFields
    }
  }
}

query volume($uuid: String!, $vmInstanceUuid: String) {
  volume(uuid: $uuid) {
    vmInstance {
      backupTaskType
      allVolumes {
        uuid
        name
        relatedResource {
          backupData
        }
        backupTaskType
      }
    }
    ...volumeFields
  }
}

