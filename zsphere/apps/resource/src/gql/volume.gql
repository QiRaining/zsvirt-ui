query getVmAndBareMetal2InstanceSummary(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $extraConditions: [Condition!]
  $sortBy: String
  $sortDirection: SortDirectionValidValues
) {
  getVmAndBareMetal2InstanceSummary(
    start: $start
    limit: $limit
    replyWithCount: true
    conditions: $conditions
    extraConditions: $extraConditions
    sortBy: $sortBy
    sortDirection: $sortDirection
  ) {
    vmTotal
    bareMetal2InstanceTotal
  }
}

query getFlattenVolumeOccupyCapacity($input: GetFlattenVolumeOccupyCapacityInput!) {
  getFlattenVolumeOccupyCapacity(input: $input) {
    list {
      uuid
      name
      type
      actualSize
    }
    error
    success
  }
}

query volumeCount(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $extraConditions: [Condition!]
  $type: VolumeQueryType
  $sortBy: String
  $sortDirection: SortDirectionValidValues
) {
  volumeList(
    start: $start
    limit: $limit
    replyWithCount: true
    conditions: $conditions
    extraConditions: $extraConditions
    type: $type
    sortBy: $sortBy
    sortDirection: $sortDirection
  ) {
    total
  }
}
