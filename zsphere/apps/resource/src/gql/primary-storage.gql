query primaryStorageCount(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $sortBy: String
  $sortDirection: SortDirectionValidValues
  $type: PrimaryStorageQueryType
  $extraConditions: [Condition!]
) {
  primaryStorageList(
    conditions: $conditions
    extraConditions: $extraConditions
    start: $start
    limit: $limit
    sortBy: $sortBy
    sortDirection: $sortDirection
    type: $type
    replyWithCount: true
    count: true
  ) {
    total
  }
}

query getClusterAttachablePrimaryStorageTypes($clusterUuid: String!) {
  getClusterAttachablePrimaryStorageTypes(clusterUuid: $clusterUuid) {
    types
  }
}

query primaryStorageMetricDataList(
  $uuid: String!
  $namespace: String!
  $metricName: String!
  $labels: [String!]
  $period: Int!
  $startTime: Float
  $endTime: Float
  $offsetAheadOfCurrentTime: Int
) {
  primaryStorageMetricDataList(
    uuid: $uuid
    namespace: $namespace
    metricName: $metricName
    labels: $labels
    period: $period
    startTime: $startTime
    endTime: $endTime
    offsetAheadOfCurrentTime: $offsetAheadOfCurrentTime
  ) {
    time
    value
    labels {
      PrimaryStorageUuid
    }
  }
}
query getBlockDeviceInfo($uuid: String!) {
  getBlockDeviceInfo(uuid: $uuid) {
    ip
    port
    storagePool
  }
}

query getPrimaryStorageRelatedSummary($uuid: String!) {
  getPrimaryStorageRelatedSummary(uuid: $uuid) {
    vmInstance
    baremetal2Instance
    volume
    blockVolume
    cluster
    baremetal2Cluster
    host
    sharedBlock
    vpcRouter
  }
}

query primaryStorageSummary($conditions: [Condition!]) {
  primaryStorageSummary(conditions: $conditions) {
    total
    connected
    disconnected
    connecting
  }
}

query getBlockDeviceInfo($uuid: String!) {
  getBlockDeviceInfo(uuid: $uuid) {
    ip
    port
  }
}

query getBlockMetadata($vendorName: String!, $metadata: String!) {
  getBlockMetadata(vendorName: $vendorName, metadata: $metadata) {
    accessZones
    storagePools
  }
}

query getTrashOnPrimaryStorage($uuid: String!) {
  getTrashOnPrimaryStorage(uuid: $uuid) {
    list {
      resourceUuid
      resourceType
      trashType
    }
  }
}

query sdsInfo($monitorNodeIp: String!) {
  sdsInfo(monitorNodeIp: $monitorNodeIp) {
    sdsVersion
    isExpandPoolSupported
  }
}

fragment primaryStoragePredictionCapacityFields on PrimaryStoragePredictionCapacityItem {
  time
  value
  type
}

query primaryStoragePredictionCapacity(
  $primaryStorageUuid: String!
  $poolUuid: String
  $startTime: Float!
  $currentTime: Float!
  $endTime: Float!
) {
  primaryStoragePredictionCapacity(
    primaryStorageUuid: $primaryStorageUuid
    poolUuid: $poolUuid
    startTime: $startTime
    currentTime: $currentTime
    endTime: $endTime
  ) {
    usedPhysicalCapacitiesForecastList {
      ...primaryStoragePredictionCapacityFields
    }
    usedPhysicalCapacitiesHistoryList {
      ...primaryStoragePredictionCapacityFields
    }
    totalPhysicalCapacitiesHistoryList {
      ...primaryStoragePredictionCapacityFields
    }
    physicalCapacitiesAlarmThresholdList {
      ...primaryStoragePredictionCapacityFields
    }
    predictAlarmPoint {
      ...primaryStoragePredictionCapacityFields
    }
    currentDayPoint {
      ...primaryStoragePredictionCapacityFields
    }
  }
}

mutation attachPrimaryStorageToCluster(
  $input: AttachPrimaryStorageToClusterInput!
) {
  attachPrimaryStorageToCluster(input: $input) {
    actionId
  }
}

mutation detachPrimaryStorageFromCluster(
  $input: DetachPrimaryStorageFromClusterInput!
) {
  detachPrimaryStorageFromCluster(input: $input) {
    actionId
  }
}
