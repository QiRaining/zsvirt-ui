query getPrimaryStorageRelatedResourceCounts($uuid: String!) {
  getPrimaryStorageRelatedResourceCounts(uuid: $uuid) {
    vm
    hardDisk
    host
    cluster
  }
}

fragment primaryStorageFields on PrimaryStorageVO {
  uuid
  name
  description
  createDate
  lastOpDate
  attachedClusterUuids
  reservedCapacity
  reservedPhysicalCapacity
  availableCapacity
  availablePhysicalCapacity
  fsid
  defaultProtocol
  mons {
    hostname
  }
  mountPath
  pools {
    uuid
    type
    aliasName
    poolName
    availableCapacity
  }
  sharedBlockGroupType
  sharedBlocks {
    uuid
    name
  }
  state
  status
  systemUsedCapacity
  totalCapacity
  totalPhysicalCapacity
  type
  url
  volumeCount
  vmInstanceCount
  cbdMdsCount
  systemTag {
    nocephx
    thinProvision
    thinProvisionUuid
    gatewayCidr
    rootVolumePoolName
    dataVolumePoolName
    imageCachePoolName
    nfsMountOptions
    cephToken
    cephVendor
    coldMigrateNetwork
  }
  expired {
    isExpired
    dayDifference
  }
  zone {
    uuid
    name
  }
  clusters {
    uuid
    name
  }
  primaryStorageCapacity {
    totalPhysicalCapacity
    availablePhysicalCapacity
    overProvisioningPrimaryStorage
    thresholdPrimaryStoragePhysicalCapacity
    systemUsedCapacity
    reservedCapacity
    volumeSnapshotSize
    imageCacheSize
    volumeSize
    vmTemplateVolumeCacheSize
  }
  storageCapacityForLocalStorage {
    reservedPhysicalCapacity
    totalPhysicalCapacity
    availablePhysicalCapacity
    imageCacheSize
    systemUsedCapacity
    volumeSize
    volumeSnapshotSize
    vmTemplateVolumeCacheSize
    overProvisioningPrimaryStorage
    reservedCapacity
  }
  zoneUuid
}

# 只用于PS主列表
query primaryStorageList(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $sortBy: String
  $sortDirection: SortDirectionValidValues
  $type: PrimaryStorageQueryType
  $extraConditions: [Condition!]
) {
  primaryStorageList(
    conditions: $conditions
    extraConditions: $extraConditions
    start: $start
    limit: $limit
    sortBy: $sortBy
    sortDirection: $sortDirection
    type: $type
    replyWithCount: true
  ) {
    total
    list {
      ...primaryStorageFields
    }
  }
}

