query hostCpuGHz($uuid: String!) {
  host(uuid: $uuid) {
    uuid
    hostSystemInfo {
      cpuGHz
    }
  }
}

fragment actionErrorFields on ActionError {
  code
  description
  details
}

fragment hostFields on HostVO {
  name
  uuid
  architecture
  managementIp
  callBackIp
  hypervisorType
  description
  state
  status
  osDistribution
  osRelease
  osVersion
  createDate
  lastOpDate
  cpuNum
  availableCpuCapacity
  sshPort
  username
  totalCpuCapacity
  availableMemoryCapacity
  totalMemoryCapacity
  extraIps
  connectedTime
  hostNodeInfo {
    nodeType
  }
  qemuState
  ipmiAddress
  ipmiPort
  ipmiUsername
  ipmiPassword
  ipmiPowerStatus
  iscsiInitiatorName
  nqn
  physicalNicList {
    uuid
    interfaceName
    hostNetworkInterfaceServiceRef {
      interfaceUuid
      vlanId
      serviceType
    }
  }
  bondList {
    uuid
    bondingName
    hostNetworkBondingServiceRef {
      bondingUuid
      vlanId
      serviceType
    }
  }
  bondRelatedVSwitch {
    uuid
    allSlavesActive
    bondingName
    hostUuid
    slaves {
      uuid
      interfaceName
      state
      speed
    }
    mode
    xmitHashPolicy
    bondingType
  }
}

fragment actionSendRespFields on ActionSendResp {
  success
  error
}

query hostList(
  $conditions: [Condition!]
  $extraConditions: [Condition!]
  $start: Int
  $limit: Int
  $topNumber: Int
  $fields: [String!]
  $type: HostQueryType
  $sortBy: String
  $sortDirection: SortDirectionValidValues
  $primaryStorageUuid: String
) {
  hostList(
    conditions: $conditions
    extraConditions: $extraConditions
    start: $start
    fields: $fields
    limit: $limit
    topNumber: $topNumber
    type: $type
    sortBy: $sortBy
    sortDirection: $sortDirection
    replyWithCount: true
  ) {
    list {
      ...hostFields
      hostUsage {
        cpuUsed
        memoryUsed
        storageUsed
      }
      cluster {
        name
        uuid
        clusterKVMCpuModel
        resourceConfigValue {
          vmVideoType
          haVmHaLevel
          vmVmHaAcrossClusters
          vmEmulateHyperV
          kvmAutoSetVmNicMultiqueue
        }
      }
      zone {
        name
        uuid
      }
      owner {
        name
        uuid
      }
      tag {
        ownerUuid
        uuid
        name
        color
      }
      hostIommu {
        state
        status
      }
      hostSystemInfo {
        cpuModelName
        hostCpuModelName
        ept
        eptUuid
        systemSerialNumber
        systemProductName
        cpuGHz
        cpuProcessorNum
        cpuSocketCoreThread {
          sockets
          coresPerSocket
          threadsPerCore
        } #
      }
      localStorageHostDiskCapacity(primaryStorageUuid: $primaryStorageUuid) {
        availableCapacity
        availablePhysicalCapacity
        totalCapacity
        totalPhysicalCapacity
      }
      globalConifg {
        memoryOverProvisioning
        overProvisioningTotalMemory
        overProvisioningAvailableMemory
        reservedMemory
        availableCpuMemoryCapacity
        availableCpu
        availableMemory
        managedCpuNum
        totalCpu
        totalMemory
      }
      hostZWatchInfo {
        cpuAllIdleUtilization
        memoryFreeInPercent
        cpuAllUsedUtilization
        memoryUsedInPercent
        memoryFreeBytes
      }
      relatedVmCount
      relatedVolumeCount
    }
    total
  }
}

