query physicalNicList(
  $extraConditions: [Condition!]
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $type: PhysicalNicQueryType
  $sortBy: String
  $sortDirection: SortDirectionValidValues
) {
  physicalNicList(
    conditions: $conditions
    start: $start
    limit: $limit
    replyWithCount: true
    extraConditions: $extraConditions
    sortBy: $sortBy
    sortDirection: $sortDirection
    type: $type
  ) {
    list {
      uuid
      name
      description
      interfaceName
      interfaceType
      interfaceModel
      interfaceFactory
      carrierActive
      slaveActive
      ipAddresses
      offloadStatus
      speed
      readyState
      state
      hostUuid
      gateway
      bondingUuid
      bond {
        uuid
        bondingName
      }
      lLDPMode {
        mode
        uuid
      }
      pciDeviceAddress
      mac
      pciDevice {
        name
        uuid
        type
        pciDeviceAddress
        vendorId
        deviceId
        subvendorId
        subdeviceId
        status
        state
        virtStatus
        physicalNicDeviceMaxPartNum
        vmCount
        mdevSpecRefs {
          mdevSpecUuid
          pciDeviceUuid
        }

        vfAvailableNum {
          vfAvailableNum
          vfTotalNum
        }
      }
      host {
        name
        uuid
        status
        cluster {
          uuid
          name
        }
      }
      hostNetworkInterfaceServiceRef {
        interfaceUuid
        vlanId
        serviceType
        serviceTypes
      }
      createDate
      vSwitch {
        uuid
        name
      }
    }
    total
  }
}

