query host($uuid: String!) {
  host(uuid: $uuid) {
    ...hostFields
    cluster {
      name
      state
      clusterKVMCpuModel
      uuid
      resourceConfigValue {
        vmVideoType
        haVmHaLevel
        vmVmHaAcrossClusters
        vmEmulateHyperV
        kvmAutoSetVmNicMultiqueue
      }
    }
    zone {
      name
      uuid
    }
    owner {
      name
      uuid
    }
    tag {
      ownerUuid
      uuid
      name
      color
    }
    hostTopology
    hostIommu {
      state
      status
    }
    hostSystemInfo {
      cpuModelName
      hostCpuModelName
      ept
      eptUuid
      ipmiAddress
      systemSerialNumber
      systemProductName
      cpuGHz
      cpuProcessorNum
      cpuSocketCoreThread {
        sockets
        coresPerSocket
        threadsPerCore
      } #
    }
    localStorageHostDiskCapacity {
      availableCapacity
      availablePhysicalCapacity
      totalCapacity
      totalPhysicalCapacity
    }
    globalConifg {
      memoryOverProvisioning
      overProvisioningTotalMemory
      overProvisioningAvailableMemory
      reservedMemory
      availableCpuMemoryCapacity
      availableCpu
      availableMemory
      managedCpuNum
      totalCpu
      totalMemory
    }
    hostZWatchInfo {
      cpuAllIdleUtilization
      memoryFreeInPercent
      cpuAllUsedUtilization
      memoryUsedInPercent
      memoryFreeBytes
    }
    relatedVmCount
    relatedVolumeCount
    hostGroup {
      uuid
      name
    }
  }
}
