    uuid
    status
  }
  primaryStorage {
    name
    uuid
    type
    state
    defaultProtocol
    availableCapacity
  }
  tag {
    ownerUuid
    name
    uuid
    color
  }
  vmNics {
    type
    uuid
    mac
    ip
    deviceId
    usedIps {
      uuid
      ip
      ipVersion
      l3NetworkUuid
    }
    l3NetworkUuid
    l3Network {
      ... on L3Network {
        name
        uuid
        l2NetworkUuid
        l2Network {
          uuid
          vSwitchType
        }
        networkServices {
          networkServiceType
        }
      }
    }
  }
  eip {
    uuid
    name
    vipIp
  }
  toolsInfo {
    lowVersion
    version
  }
  allVolumes {
    uuid
    name
    deviceId
    lastAttachDate
    primaryStorageUuid
    size
    actualSize
    isShareable
    type
    installPath
    primaryStorage {
      type
      uuid
      name
      defaultProtocol
    }
  }
  gpuDeviceSpec {
    name
    isVirtual
    type
    uuid
    deviceType
  }
  systemTag {
    cpuCores
    cpuSockets
    haStickStragedy
    sshkey
    bootOrder
    bootOrderOnce
    consolePassword
    vmConsoleMode
    vmPriority
    GuestTools
    bootMode
    RDPEnable
    usbRedirect
    qemuga
    antiSpoofing
    VDIMonitorNumber
    userdata
    clockTrack
    timeTrack
    isoList {
      uuid
      index
    }
    vmCpuPinningList {
      vCPU
      pCPU
    }
    staticIp {
      l3NetworkUuid
      ip
    }
    vmDriver
    hostname
    qxlMemory {
      ram
      vram
      vgamem
    }
    vmMachineType
  }
  vmHa {
    haLevel
  }
  vmCdRoms {
    uuid
    isoUuid
  }
  zoneUuid
  relatedResource {
    backupData
  }
  # cdpTaskStatus
  exportInfo {
    uuid
    name
    exportUrl
    createDate
    size
  }
  vmGroup {
    uuid
    name
    vmSchedulingRuleCount
    associatedVmSchedulingRuleList {
      uuid
      name
      rule
      mode
      hostGroup {
        uuid
        name
      }
    }
    vmCount
  }
  schedulingState
  group {
    groupName
    uuid
  }
  qemuState
  haveScsiLun
  lastBackupJobResult {
    id
    fireInstanceId
    success
    resultDump
  }
  localBackupCount
  localBackupCapacity
  backupJob {
    uuid
    jobData
    state
    schedulerJobGroupJobRefs {
      schedulerJobGroupUuid
      priority
    }
    schedulerJobGroup {
      uuid
      name
    }
  }
  shareType
  userGroup {
    uuid
    name
  }
  lastOpDate
}

query vmInstanceDetail($uuid: String!) {
  vmInstance(uuid: $uuid) {
    volumeAttributeUserConfig
    emulatorPin
    sshKeyPairs {
      uuid
      name
    }
    securityGroup {
      name
      uuid
    }
    cpuModeInfo {
      value
      dependentResourceType
    }
    hasTopology
    vmCdRoms {
      uuid
      isoUuid
    }
    consoleAddress
    bootOrder {
      orders
    }
    snapshotSchedulerJob {
      uuid
      name
    }
    uptime
    tpmList {
      uuid
      vmInstanceUuid
    }
    ...vmInstanceDetailFields
  }
}

query guestToolsInfoInVMDetail($uuid: String!) {
  guestToolInfo(uuid: $uuid) {
    lowVersion
    features {
      pvpanic
      pvpanic_host_enable
      pvpanic_guest_tools_enable
      pvpanic_guest_kernel_supported
    }
    status
  }
}

query templatedVmInstanceList(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $type: VmQueryType
  $extraConditions: [Condition!] = []
  $sortBy: String
