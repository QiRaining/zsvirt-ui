mutation createInstance($input: CreateInstanceInput!) {
  createInstance(input: $input) {
    actionId
  }
}

mutation createVMFromTemplate($input: CreateVMFromTemplateInput!) {
  createVMFromTemplate(input: $input) {
    actionId
  }
}

query getStorageMigrateVmInstancesDepends($uuids: [String!]!) {
  batchStorageMigrateVmInstancedepends(uuids: $uuids) {
    isAttachedScsiLunDevice
    hasUnavailableUsbDevice
    hasPeripheralAttached
    uuid
  }
}
query instanceBasicInfo(
  $conditions: [Condition!]
  $start: Int
  $limit: Int
  $type: VmQueryType
  $extraConditions: [Condition!] = []
  $sortBy: String
  $sortDirection: SortDirectionValidValues
) {
  vmInstanceList(
    start: $start
    limit: $limit
    replyWithCount: true
    conditions: $conditions
    type: $type
    extraConditions: $extraConditions
    sortBy: $sortBy
    sortDirection: $sortDirection
  ) {
    list {
      uuid
      name
      architecture
      crashStrategy
      cpuNum
      memorySize
      description
      clusterUuid
      rootVolumeUuid
      platform
      guestOsType
      defaultL3NetworkUuid
      imageUuid
      lastHostUuid
      hostUuid
      backupStatus
      backupTaskStatus
      reservedMemorySize
      defaultL3Network {
        name
        uuid
        ipVersion
        networkType
      }

      systemTag {
        cpuCores
        cpuSockets
        haStickStragedy
        sshkey
        bootOrder
        bootOrderOnce
        consolePassword
        vmConsoleMode
        vmPriority
        GuestTools
        bootMode
        RDPEnable
        usbRedirect
        qemuga
        antiSpoofing
        VDIMonitorNumber
        userdata
        clockTrack
        timeTrack
        vmDriver
        hostname
        qxlMemory {
          ram
          vram
          vgamem
        }
      }
      vmHa {
        haLevel
      }
      zoneUuid
      group {
        groupName
        uuid
      }
    }
  }
}

